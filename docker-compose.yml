version: '3.8'

# Docker Compose configuration for CascadeIQ services
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: cascadeiq
      POSTGRES_PASSWORD: cascadeiq_dev
      POSTGRES_DB: cascadeiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://cascadeiq:cascadeiq_dev@postgres:5432/cascadeiq
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
  payment-service:
    build: ./infrastructure/docker/payment-service
    ports:
      - "9001:9001"
  auth-service:
    build: ./infrastructure/docker/auth-service
    ports:
      - "9002:9002"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"

volumes:
  postgres_data:
  redis_data:

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
