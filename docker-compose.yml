version: '3.8'

# Docker Compose configuration for CascadeIQ services
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: cascadeiq
      POSTGRES_PASSWORD: cascadeiq
      POSTGRES_DB: cascadeiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://cascadeiq:cascadeiq@postgres:5432/cascadeiq
      REDIS_URL: redis://redis:6379
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
  payment-service:
    build: ./infrastructure/docker/payment-service
    ports:
      - "9001:9001"
  auth-service:
    build: ./infrastructure/docker/auth-service
    ports:
      - "9002:9002"

volumes:
  postgres_data:
  redis_data:
